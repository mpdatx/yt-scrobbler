# yt-scrobbler rules
# Edit this file to tune filtering and normalization without touching code.
# Re-run the pipeline after changes — no code changes needed.

channels:
  # Always treat these as music regardless of YouTube category.
  # Glob:  use * as wildcard  →  "*VEVO" matches "TaylorSwiftVEVO"
  # Regex: wrap in /…/        →  "/Records$/" matches "XL Recordings" etc.
  whitelist:
    - "*VEVO"
    - "*vevo"
    - "/\\bRecord/"             # matches "Records", "Recordings", "Recording"
    - "/\\bMusic\\b/"           # matches "Music" as a whole word
    # - "Monstercat"

  # Never treat these as music even if YouTube category says Music.
  blacklist:
    - "freeCodeCamp.org"
    # - "/^(?:Kurzgesagt|TED|TEDx.*)/i"   # skip educational channels by regex

  # Flag all videos from these channels as needs_review with the given reason.
  # Supports the same glob / /regex/ syntax as whitelist and blacklist.
  # Valid reasons: ost, full_album, compilation, poor_title, unverified_artist
  # (or any custom string — it becomes the review bucket name)
  review:
    # - pattern: "GameSoundtrackChannel"
    #   reason: ost
    # - pattern: "/\\bSoundtrack\\b/"
    #   reason: ost
    # - pattern: "SomeAlbumDumpChannel"
    #   reason: full_album

# Force specific video IDs to a given artist/track (skips filter + normalize).
# Find the ID in out/audit_dropped.csv or the URL: youtube.com/watch?v=VIDEO_ID
video_overrides:
  # "dQw4w9WgXcQ":
  #   artist: "Rick Astley"
  #   track: "Never Gonna Give You Up"
  #   album: "Whenever You Need Somebody"   # optional

# Map channel names to artist names for non-Topic channels.
# Useful for VEVO and label channels where the channel name != artist name.
# Set to null (~) to skip the channel entirely.
channel_artist_map:
  # "KendrickLamarVEVO": "Kendrick Lamar"
  # "TaylorSwiftVEVO": "Taylor Swift"
  # "UMG_YouTube": ~

# Tune the duration threshold above which a video is flagged as full_album.
# Default is 20 minutes. Set higher to allow live recordings, DJ sets you want, etc.
# thresholds:
#   full_album_duration_minutes: 20

# Title-level rules, applied in order before any other normalization.
# Each rule needs a 'match' regex and an 'action':
#
#   action: skip     — drop this video entirely (useful for mix/stream titles)
#   action: strip    — remove the matched text from the title, then normalize normally
#   action: extract  — pull artist/track from capture groups \1, \2, etc.
#                      (first matching extract rule wins)
#   action: review   — flag as needs_review with the given reason (must include 'reason:')
#                      (first matching review rule wins; does not modify the title)
#
# All strip rules run first (in order), then the first matching extract/review rule.
# skip rules are checked before filter even runs.
title_patterns:
  # Drop AI-generated music platforms
  # - match: "\\|\\s*(?:Udio|Suno)\\s*(AI|Music)?\\s*$"
  #   action: skip

  # Strip "| Artist Name" label suffixes some channels append
  # - match: "\\s*\\|\\s*[A-Z][^|]+$"
  #   action: strip

  # Channels that reverse the usual order: "Track Name - Artist Name"
  # - match: "^(.+?)\\s+-\\s+(.+)$"
  #   action: extract
  #   artist: "\\2"
  #   track: "\\1"

  # Skip hour-long mixes and compilations
  # - match: "(?:hour|hr\\.?)\\s+mix|full\\s+album|playlist"
  #   action: skip

  # Flag game/anime soundtracks for review instead of dropping
  # - match: "\\bO\\.?S\\.?T\\.?\\b|original\\s+soundtrack|game\\s+(?:music|ost)"
  #   action: review
  #   reason: ost

  # Flag NCS / label releases that need artist extraction help
  # - match: "\\[NCS\\s+Release\\]|\\[Monstercat\\]"
  #   action: review
  #   reason: poor_title
