[project]
name = "yt-scrobbler"
version = "0.1.0"
description = "Convert YouTube Takeout watch history into backdated Last.fm scrobbles"
requires-python = ">=3.8"
dependencies = [
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "ijson>=3.2.3",
]

[project.scripts]
yt-scrobbler = "main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
